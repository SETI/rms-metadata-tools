# Test GCP config for the VGISS_xxxx geometry stage: one small instance, one
# task at a time. Use it to try a volume or two before a production run, e.g.
#
#   metadata-geometry-cloud VGISS_xxxx <paths...> --use-spot --volumes VGISS_5102
#
# VGISS_5102, with 317 images, is the smallest volume. A typical volume holds
# about 900 images and should take under half an hour on one task.
provider: gcp
gcp:
  job_id:                   metadata-geometry-job
  project_id:               rms-metadata
  region:                   us-central1
  zone:                     us-central1-a

  instance_types:           ["^n2-standard-.*"]
  boot_disk_types:          pd-balanced
  max_instances:            1
  cpus_per_task:            2
  min_memory_per_task:      8            # GB; see gcp_geometry_prod_config.yml

  max_runtime:              14400
  max_cpu:                  2
