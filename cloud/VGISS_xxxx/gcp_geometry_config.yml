# Test GCP config for the VGISS_xxxx geometry stage: one small instance, one
# task at a time. Use it to try a volume or two before a production run, e.g.
#
#   metadata-geometry-cloud VGISS_xxxx <paths...> --use-spot --volumes VGISS_6102
#
# VGISS_6102, with 394 images, is the smallest volume whose every image the
# spacecraft SP kernels now cover; the 22 volumes they do not wholly cover
# (see gcp_geometry_prod_config.yml), among them the smaller VGISS_5102, fail
# until a cruise SPK is furnished. A typical volume holds
# about 900 images and, at about 2.7 s an image, takes about 40 minutes on one
# task.
provider: gcp
gcp:
  job_id:                   metadata-geometry-job
  project_id:               rms-metadata
  region:                   us-central1
  zone:                     us-central1-a

  instance_types:           ["^n2-standard-.*"]
  boot_disk_types:          pd-balanced
  max_instances:            1
  cpus_per_task:            2
  min_memory_per_task:      8            # GB; see gcp_geometry_prod_config.yml

  max_runtime:              14400
  max_cpu:                  2
