[build-system]
requires = ["setuptools>=77", "setuptools_scm[toml]"]
build-backend = "setuptools.build_meta"

[project]
name = "rms-metadata-tools"
dynamic = ["version"]
description = "Generate PDS3 index, geometry, and cumulative metadata tables and labels for planetary science data collections"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.3.0",
  "rms-oops>=0.2.0",
  "rms-polymath>=2.0.0",
  "rms-filecache>=3.1.0",
  "rms-pdslogger>=3.0.0",
  "rms-julian>=3.0.1",
  "rms-pdsparser>=2.0.0",
  "rms-pdstable>=1.0.3",
  "rms-vicar>=1.2.1",
  "rms-pdstemplate>=2.4.0",
  "rms-textkernel>=1.1.1",
  "fortranformat>=2.0.3",
]
license = "Apache-2.0"
authors = [
  {name = "Joe Spitale", email = "jspitale@seti.org"}
]
maintainers = [
  {name = "Joe Spitale", email = "jspitale@seti.org"}
]
keywords = [
  "pds", "pds3", "planetary science", "metadata", "geometry",
  "spice", "ring-moon systems", "astronomy",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Natural Language :: English",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows"
]

[project.urls]
Homepage = "https://github.com/SETI/rms-metadata-tools"
Documentation = "https://rms-metadata-tools.readthedocs.io/en/latest"
Repository = "https://github.com/SETI/rms-metadata-tools"
Source = "https://github.com/SETI/rms-metadata-tools"
Issues = "https://github.com/SETI/rms-metadata-tools/issues"

[tool.pytest.ini_options]
pythonpath = [
  "src"
]
testpaths = ["tests"]
addopts = ["-n", "auto", "--strict-markers", "--strict-config", "-m", "not integration and not requires_archive"]
markers = [
  "integration: requires oops/SPICE host initialization (excluded by default)",
  "requires_archive: requires the $RMS_METADATA holdings tree (excluded by default)",
]
filterwarnings = [
  "error",
]

[tool.setuptools.packages.find]
# Only packages under src/ are discovered. The top-level cloud/ deployment tree
# (the per-host GCP config YAMLs) is outside src/ and therefore never ships in
# the wheel.
where = ["src"]

# PDS3 label templates are read at runtime (see defs.GLOBAL_TEMPLATE_PATH and the
# per-host templates/ directories), as is the GCP startup-script template (see
# cli._host.DEFAULT_STARTUP_TEMPLATE); they must ship in the wheel.
[tool.setuptools.package-data]
"metadata_tools" = ["py.typed", "templates/*.lbl"]
"metadata_tools.cli" = ["gcp_common_startup.sh"]
"metadata_tools.hosts.GO_0xxx" = ["templates/*.lbl"]

[tool.setuptools_scm]
local_scheme = "no-local-version"
write_to = "src/metadata_tools/_version.py"

[project.optional-dependencies]
dev = [
  "coverage>=7.0",
  "mypy>=1.0",
  "pymarkdownlnt>=0.9.39",
  "pytest>=7.0",
  "pytest-cov>=7.1.0",
  "pytest-randomly>=4.1.0",
  "pytest-xdist>=3.8.0",
  "ruff>=0.16.5",
  "types-PyYAML",
  "bandit[toml]>=1.9.4",
  "pip-audit>=2.7",
  "pyroma>=4.2",
  "vulture>=2.16",
  "rms-metadata-tools[docs]",
]
docs = [
  "myst-parser",
  "sphinx>=7",
  "sphinxcontrib-mermaid",
  "sphinx-rtd-theme",
]
# Extra dependencies for distributing table generation across GCP via
# rms-cloud-tasks (the hosts/<HOST>/*_cloud.py workers).
cloud = [
  "rms-cloud-tasks>=0.2.0",
  "PyYAML>=6.0",
]

[project.scripts]
metadata-index            = "metadata_tools.cli.index:main"
metadata-geometry         = "metadata_tools.cli.geometry:main"
metadata-cumulative       = "metadata_tools.cli.cumulative:main"
metadata-index-worker     = "metadata_tools.cli.index_worker:main"
metadata-geometry-worker  = "metadata_tools.cli.geometry_worker:main"
metadata-cumulative-worker = "metadata_tools.cli.cumulative_worker:main"
metadata-index-cloud      = "metadata_tools.cli.index_cloud:main"
metadata-geometry-cloud   = "metadata_tools.cli.geometry_cloud:main"
metadata-cumulative-cloud = "metadata_tools.cli.cumulative_cloud:main"
metadata-task-list        = "metadata_tools.cli.task_list:main"

# Tool configuration

[tool.coverage.run]
branch = true
parallel = true
source = ["metadata_tools"]
# The default test run is hermetic (no SPICE kernels, no $RMS_METADATA holdings).
# Coverage therefore measures the host-agnostic engine plus the testable CLI
# plumbing (cli/_host.py and the cloud worker task callables). The following
# are excluded from the denominator because they cannot run without SPICE/GCP:
#   - hosts/*       per-host plugin config and label templates; the config
#                   modules drive oops/SPICE.
#   - bodies.py     builds the oops Body registry via oops.Body.lookup(), which
#                   needs the kernels; the engine tests stub it (see
#                   tests/conftest.py).
#   - cli/ entry modules other than _host.py and *_worker.py: thin main()
#                   wrappers that load a real host and run an engine or GCP.
# Any other SPICE-only seam is excluded with a targeted, commented
# `# pragma: no cover` at the call site, never a blanket file omit.
omit = [
  "tests/*",
  "*/_version.py",
  "*/metadata_tools/bodies.py",
  "*/metadata_tools/hosts/*",
  "*/metadata_tools/cli/__init__.py",
  "*/metadata_tools/cli/index.py",
  "*/metadata_tools/cli/geometry.py",
  "*/metadata_tools/cli/cumulative.py",
  "*/metadata_tools/cli/task_list.py",
  "*/metadata_tools/cli/*_cloud.py",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise NotImplementedError",
]
fail_under = 90

[tool.mypy]
strict = true
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = "metadata_tools._version"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Third-party runtime deps that ship no type stubs or py.typed marker.
module = [
    "oops.*",
    "polymath.*",
    "cspyce.*",
    "fortranformat.*",
    "julian.*",
    "pdslogger.*",
    "pdsparser.*",
    "pdstable.*",
    "pdstemplate.*",
    "vicar.*",
    "textkernel.*",
    "cloud_tasks.*",
    "spicedb.*",
]
ignore_missing_imports = true


[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Explicit rule set (recommended for library projects). Categories:
# E, W = pycodestyle errors/warnings; F = Pyflakes; I = isort; UP = pyupgrade;
# B = bugbear; SIM = simplify; C4 = comprehensions; A = builtins (no shadowing);
# N = pep8-naming; PT = pytest-style; RUF = Ruff-specific (e.g. unused noqa).
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "A", "N", "PT", "RUF"]
# PT011 - pytest.raises is too broad.
# SIM105 - Use contextlib.suppress for suppressions.
# SIM108 - Use ternary operator for simple if/else.
# RUF005 - Prefer iterable unpacking over concatenation.
# B028 - warnings.warn without stacklevel; irrelevant with no external callers.
# SIM102 - Use a single if instead of nested ifs.
# N999 - Invalid module name; host scripts use the PDS volume-set ID (e.g. GO_0xxx_index).
# UP031 - Use format specifiers instead of percent format.
extend-ignore = ["PT011", "SIM105", "SIM108", "RUF005", "B028", "SIM102", "N999", "UP031"]

[tool.pymarkdown.plugins.md013]
# Line length (disable so README/CONTRIBUTING can use longer lines).
enabled = false

[tool.pymarkdown.plugins.md033]
# Inline HTML (e.g. <br>) allowed in Markdown.
enabled = false

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
targets = ["src"]

[tool.vulture]
# Library code only: pytest fixture parameters used for their side effects
# would otherwise read as unused variables.
paths = ["src"]
exclude = ["tests/"]
min_confidence = 70
